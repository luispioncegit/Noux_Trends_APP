services:
  # --- SERVICIO DEL BACKEND ---
  - type: web
    name: nouxtrends-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port 8002
    envVars:
      - key: PORT
        value: 8002
      - key: PYTHON_VERSION
        value: 3.10.0

  # --- SERVICIO DEL FRONTEND ---
  - type: web
    name: nouxtrends-frontend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run frontend/main.py --server.port 8501 --server.address 0.0.0.0
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: nouxtrends-backend
          property: host
        # Esto le añade el sufijo necesario a la URL que genera Render
        append: /api/v1 
      - key: PYTHON_VERSION
        value: 3.10.0